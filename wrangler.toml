# Cloudflare Worker config for the Buffer Bros site.
# The site is served as static assets; the booking API runs in the Worker
# (src/index.js) and talks to a D1 database.

name = "bufferbros-website"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Static site files live in public/. Server code (src, functions), config
# and docs stay at the repo root and are never served publicly.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database binding (created with `wrangler d1 create bufferbros`).
[[d1_databases]]
binding = "DB"
database_name = "bufferbros"
database_id = "af0315e9-272e-4c3f-8794-37f854f6b22d"

# Non-secret vars. Secrets (ADMIN_PASSWORD, ADMIN_SECRET, RESEND_API_KEY,
# OWNER_EMAIL, FROM_EMAIL) are set in the dashboard or with `wrangler secret put`.
[vars]
TIMEZONE = "America/New_York"
